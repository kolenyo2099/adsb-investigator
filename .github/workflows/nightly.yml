name: Nightly archive

# adsb.lol keeps only a rolling ~31-day window of the current year, so a day
# that isn't captured here becomes expensive to recover later (it survives only
# in multi-GB daily tarballs). This job is the archive.

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC, after the previous day is complete upstream
  workflow_dispatch:
    inputs:
      dates:
        description: 'Space-separated YYYY-MM-DD dates to (re)build. Blank = yesterday.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: nightly-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve target dates
        id: dates
        run: |
          if [ -n "${{ inputs.dates }}" ]; then
            echo "list=${{ inputs.dates }}" >> "$GITHUB_OUTPUT"
          else
            echo "list=$(date -u -d yesterday +%F)" >> "$GITHUB_OUTPUT"
          fi

      # Everything the browser reads: what flew, the flights each aircraft
      # made, and the paths. A day is 48 half-hour files upstream, so this
      # pulls around a gigabyte and takes a few minutes.
      - name: Build daily index
        run: python3 scripts/build_index.py ${{ steps.dates.outputs.list }}

      # The index and the flight legs are the archive and are kept. Path
      # geometry is a drawing convenience several times their size, so old
      # ones are dropped; any day can be rebuilt with workflow_dispatch.
      - name: Prune flight paths older than 90 days
        run: |
          find data/daily -name '*.tracks.json.gz' -mtime +90 -print -delete || true

      - name: Commit
        run: |
          git config user.name "adsb-investigator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "data: archive ${{ steps.dates.outputs.list }}"
            # Another run may have landed while this one was scanning.
            git pull --rebase --autostash origin main
            git push
          fi
